name: Banking Data Pipeline CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute End-to-End Pipeline (Bronze -> Silver -> Gold)
      run: |
        python3 main.py

    - name: Run Data Quality Assertion Suite
      run: |
        python3 src/quality/data_quality_tests.py

    - name: Upload Gold Analytical Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: gold-analytics-reports
        path: data/gold/*.csv
